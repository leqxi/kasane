# Publishes a tagged version to npm and lists it as a GitHub release.
#
# npm authenticates through trusted publishing (OIDC), so there is no token in the repository and
# no one-time password to type, and the package gets provenance: npm can show which commit and
# which workflow built the tarball.
#
# One-time setup on npmjs.com, after the first manual publish:
#   package @leqxi/kasane -> Settings -> Trusted publisher -> GitHub Actions
#   owner leqxi, repository kasane, workflow release.yml, no environment
#
# To cut a release:
#   1. move the CHANGELOG's Unreleased entries under a new "## [x.y.z]" heading
#   2. npm version x.y.z        (writes package.json and makes the commit and the tag)
#   3. git push --follow-tags
#
# Or run it by hand for a tag that is already pushed:
#   gh workflow run release.yml -f tag=v0.2.0

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: The tag names the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "package.json is $version but the tag is $TAG" >&2
            exit 1
          fi

      - name: The changelog has an entry for it
        run: node scripts/notes.mjs "${TAG#v}" > notes.md

      - run: npm run check

      # What ships is checked against the browser first. A tag is usually a commit CI already
      # passed, but a publish is the one thing that cannot be taken back.
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm test

      # Before the publish: a release page can be edited or deleted afterwards, a published version
      # cannot. If the publish then fails, the tag still reads as a release and a rerun picks up
      # where it left off.
      - name: List it as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
